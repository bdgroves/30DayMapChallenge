      - name: "CASCADIA-WX: Northwest weather balloons"
        url: https://brooksgroves.com/cascadia-wx/


  - day: 30
    theme: Pen & paper
    title: "If you hit the third cattle guard"
    pitch: "The hot-spring napkin from my memoir, redrawn by hand in bar ink on a cocktail napkin: the springs outside Bridgeport and the roads between them, with directions counted in cattle guards, not miles. Drawn from memory, like the original."
    data: []
    tools: [Pen, a cocktail napkin, a scanner]
    prep: "Draw it in November, from memory, without looking at a map. Save the scan as day-30-pen-and-paper/napkin.jpg and render; make.py frames it. On the day, add the story link (post: https://memoir.brooksgroves.com/cattle-guard.html)."
