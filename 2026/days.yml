# #30DayMapChallenge 2026 — the plan. One entry per day; everything else is built from this file.
# status: idea → data (data in hand) → draft → done → posted
# Run `pixi run build` (or the GitHub Action does it) to regenerate the day READMEs, days.json and the 2026 README.

year: 2026
start: 2026-11-01
hashtag: "#30DayMapChallenge"
author: Brooks Groves
site: https://brooksgroves.com
gallery: https://brooksgroves.com/30DayMapChallenge/2026/

days:
  - day: 1
    theme: Points
    title: "1,190 finds"
    pitch: "Every geocache I've found as Hipparchus, one dot each, coloured by year. Twenty-odd years of where curiosity has taken me."
    data:
      - name: "Geocaching \"My Finds\" pocket query (GPX)"
        url: https://www.geocaching.com/pocket/
        note: "Premium feature; can be run once every 3 days. Request it in October."
    tools: [Python, geopandas, matplotlib]
    prep: "Drafted from the My Finds pocket query (October 3). finds.csv holds positions rounded to about a kilometre; the GPX stays out of the repo. To refresh, drop a new pocket query in data/ and run make.py --from-gpx."
    status: draft

  - day: 2
    theme: Lines
    title: "The Seawall"
    pitch: "The path around Stanley Park in Vancouver: 8.75 km of Seawall between the forest and the sea, on a Mapbox Outdoors basemap, with the landmarks along the way."
    data:
      - name: "OpenStreetMap (Overpass API)"
        url: https://overpass-api.de/
    tools: [Python, geopandas, matplotlib]
    prep: "Drafted from OpenStreetMap. (The Strava heatmap idea is kept as make_strava.py for later.)"
    status: draft

  - day: 3
    theme: Polygons
    title: "Every fire around Groveland"
    pitch: "Every recorded fire perimeter in Tuolumne County since the early 1900s, oldest faint, newest bright, with the Rim Fire (2013) wrapped around Groveland."
    data:
      - name: "CAL FIRE FRAP fire perimeters"
        url: https://www.fire.ca.gov/what-we-do/fire-resource-assessment-program/fire-perimeters
    tools: [Python, geopandas]
    prep: "Drafted from the CAL FIRE perimeter service; re-run in November for any late-season fires."
    status: draft

  - day: 4
    theme: Clusters
    title: "Rainier's swarms"
    pitch: "Earthquakes within 30 km of Mount Rainier since 2000, grouped into swarms by space and time. The July 2025 swarm, the largest ever recorded there, stands out."
    data:
      - name: "USGS ComCat earthquake catalog (API, no key)"
        url: https://earthquake.usgs.gov/fdsnws/event/1/
    tools: [Python, scikit-learn (DBSCAN), matplotlib]
    prep: "Drafted. Re-run in November to pick up the latest earthquakes."
    status: draft
    deeper:
      - name: "lahar-watch: the network watching Rainier"
        url: https://brooksgroves.com/lahar-watch/
      - name: "AFTERSHOCK: live earthquake monitor"
        url: https://brooksgroves.com/aftershock
      - name: "Blog: lahar-watch, revisited"
        url: https://brooksgroves.com/blog/lahar-watch-revisited-post.html

  - day: 5
    theme: Sight
    title: "Where you can see Rainier from"
    pitch: "A viewshed from the summit of Mount Rainier over 30 m terrain, with Earth's curvature and refraction, showing every place in Washington with a line of sight to the mountain."
    data:
      - name: "Copernicus DEM GLO-30 (AWS open data)"
        url: https://registry.opendata.aws/copernicus-dem/
    tools: [Python, rasterio, a viewshed routine (GDAL gdal_viewshed)]
    prep: "Drafted (Copernicus GLO-90 and gdal_viewshed)."
    status: draft

  - day: 6
    theme: Vintage
    title: "Tasman to Cook"
    pitch: "James Cook's 1772 chart of New Zealand, lined up with today's coast, with the stretches Abel Tasman saw in 1642–43 in gold. A map version of my Cartographic Perspectives article."
    data:
      - name: "Cook's Chart of New-Zealand (1772), Royal Museums Greenwich F0293, via Wikimedia Commons"
        url: https://commons.wikimedia.org/wiki/File:Chart_of_New_Zealand,_explored_in_1769_and_1770_by_Lieut._I-_Cook,Commander_of_His_Majesty%27s_Bark_Endeavour._RMG_F0293.tiff
      - name: "Tasman map (c. 1644), State Library of New South Wales, via Wikimedia Commons"
        url: https://commons.wikimedia.org/wiki/File:Tasman_Map_SLNSWSLNSW_FL19288478.jpg
      - name: "Natural Earth coastline"
        url: https://www.naturalearthdata.com/
    tools: [Python, geopandas, matplotlib]
    prep: "Drafted: Cook's chart georeferenced from its own Mercator graticule (fit within 3 px), today's coast over it, Tasman's coast and an inset of his chart."
    status: draft
    deeper:
      - name: "My review of A Draught of the South Land, Cartographic Perspectives"
        url: https://cartographicperspectives.org/index.php/journal/article/view/1959

  - day: 7
    theme: 10 minute map
    title: "Ten minutes, on the clock"
    pitch: "Whatever the day brings, made in ten minutes with a timer visible in the corner of the screenshot."
    data: []
    tools: [Whatever is open]
    prep: "Nothing. That's the point."
    status: idea

  - day: 8
    theme: Utopia
    title: "Paradise, Eden, Utopia"
    pitch: "Every place in the United States named Paradise, Eden, Utopia, Arcadia or Shangri-La, from Paradise on Rainier to Utopia, Texas."
    data:
      - name: "USGS GNIS domestic names"
        url: https://www.usgs.gov/us-board-on-geographic-names/download-gnis-data
    tools: [Python, geopandas]
    prep: "Drafted from the GNIS national file."
    status: draft

  - day: 9
    theme: Urban-rural
    title: "Tacoma to Paradise"
    pitch: "One line from the Port of Tacoma to Paradise on Rainier, and what changes along it: people, buildings, trees and elevation."
    data:
      - name: "Census 2020 blocks and population"
        url: https://www.census.gov/geographies/mapping-files/time-series/geo/tiger-line-file.html
      - name: "GHSL built-up surface"
        url: https://human-settlement.emergency.copernicus.eu/
    tools: [Python, rasterio, matplotlib]
    prep: "Drafted (2020 census blocks, Copernicus DEM)."
    status: draft

  - day: 10
    theme: Prompting only
    title: "A map made only by asking"
    pitch: "Big Creek's watershed above Groveland as a 1960s line-printer map: a FORTRAN program, written entirely from a one-sentence prompt, prints the basin in eight overprinted tones on green-bar paper, the way SYMAP did. The prompts are posted with it."
    data:
      - name: "USGS NLDI (basin and flowlines for gage 11284400)"
        url: https://labs.waterdata.usgs.gov/about-nldi/
      - name: "Copernicus DEM GLO-30"
        url: https://registry.opendata.aws/copernicus-dem/
    tools: [Claude, FORTRAN (gfortran), Python]
    prep: "Drafted. Rule: no hand edits; every change is asked for in words and logged in PROMPTS.md."
    status: draft
    deeper:
      - name: "The prompts, and the FORTRAN"
        url: https://github.com/bdgroves/30DayMapChallenge/tree/main/2026/day-10-prompting-only
      - name: "PUGET-TIDES: tides of Puget Sound in FORTRAN"
        url: https://brooksgroves.com/puget-tides/
      - name: "CASCADIA-WX: Northwest weather balloons in FORTRAN"
        url: https://brooksgroves.com/cascadia-wx/
      - name: "SIERRA-FLOW: Sierra rivers in COBOL"
        url: https://brooksgroves.com/sierra-flow-cobol/

  - day: 11
    theme: Sound
    title: "Where the tsunami sirens reach"
    pitch: "Washington's tsunami sirens, each with the one-mile circle it's designed to be heard in, over the tsunami hazard zones they're there to empty. (Pierce County's lahar sirens were the first idea, but their locations aren't published.)"
    data:
      - name: "WA Emergency Management AHAB siren points"
        url: https://services7.arcgis.com/vUVXhXafpruJFs3l/arcgis/rest/services/AHAB_Points/FeatureServer
      - name: "WA DNR tsunami hazard zones"
        url: https://gis.dnr.wa.gov/site3/rest/services/Geology/Tsunami_Hazard/FeatureServer
      - name: "Grays Harbor County EM: AHAB range (1 mile, outdoors)"
        url: https://www.graysharbor.us/departments/emergency_management/ahab.php
    tools: [Python, geopandas, Mapbox]
    prep: "Drafted. If Pierce County shares its lahar siren locations, the original idea can come back."
    status: draft
    deeper:
      - name: "PUGET-TIDES: tides of Puget Sound in FORTRAN"
        url: https://brooksgroves.com/puget-tides/
      - name: "Blog: PUGET-TIDES"
        url: https://brooksgroves.com/blog/puget-tides-post.html

  - day: 12
    theme: Power
    title: "The Tuolumne powers San Francisco"
    pitch: "Hetch Hetchy's dams, the powerhouse at Moccasin just below Groveland, and the lines that carry the Tuolumne's power to San Francisco."
    data:
      - name: "EIA U.S. Energy Atlas (power plants, transmission lines)"
        url: https://atlas.eia.gov/
      - name: "SFPUC Hetch Hetchy Regional Water System"
        url: https://www.sfpuc.gov/
    tools: [Python, geopandas]
    prep: "Drafted from OpenStreetMap (Overpass)."
    status: draft
    deeper:
      - name: "SIERRA-FLOW: Sierra rivers in COBOL"
        url: https://brooksgroves.com/sierra-flow-cobol/
      - name: "Sierra Streamflow dashboard"
        url: https://brooksgroves.com/sierra-streamflow

  - day: 13
    theme: Interactions
    title: "Follow a raindrop"
    pitch: "Click anywhere in the Sierra and watch where the water goes, river by river, to the sea, using the USGS's navigation service."
    data:
      - name: "USGS NLDI (Network-Linked Data Index)"
        url: https://labs.waterdata.usgs.gov/about-nldi/
    tools: [MapLibre GL JS, NLDI API]
    prep: "Drafted as an interactive page (day-13-interactions/index.html), with a still from the live page for posts."
    status: draft
    link: day-13-interactions/
    deeper:
      - name: "Sierra Streamflow dashboard"
        url: https://brooksgroves.com/sierra-streamflow
      - name: "Blog: Sierra Streamflow, revisited"
        url: https://brooksgroves.com/blog/sierra-streamflow-2027-post.html

  - day: 14
    theme: Borgesian map
    title: "1:1"
    pitch: "Borges's map the size of the empire, made literal. Big Creek's watershed at full scale as a page you can scroll for miles, with an odometer showing how far you've gone."
    data:
      - name: "USGS NLDI basin for Big Creek (11284400)"
        url: https://labs.waterdata.usgs.gov/about-nldi/
    tools: [HTML, canvas]
    prep: "Drafted as a page (day-14-borgesian-map/index.html): the basin and streams from NLDI at 96 CSS px to the inch, an odometer, a minimap and three speeds. A still from the live page is in out/."
    link: day-14-borgesian-map/
    status: draft
    deeper:
      - name: "Blog: The Creek That Isn't There (Big Creek)"
        url: https://brooksgroves.com/blog/the-creek-that-isnt-there.html

  - day: 15
    theme: Inside out
    title: "Inside Kīlauea"
    pitch: "The earthquakes beneath Kīlauea's summit in cross-section, sketching the magma plumbing that the surface hides."
    data:
      - name: "USGS ComCat (HVO-located earthquakes)"
        url: https://earthquake.usgs.gov/fdsnws/event/1/
    tools: [Python, matplotlib or forge3d]
    prep: "Drafted from ComCat since 2019."
    status: draft
    deeper:
      - name: "PELE: Hawaiʻi volcanoes, live"
        url: https://brooksgroves.com/PELE
      - name: "Blog: PELE, revisited"
        url: https://brooksgroves.com/blog/pele-revisited-post.html

  - day: 16
    theme: Collaborative map
    title: "Your favourite Sierra trailheads"
    pitch: "Made with whoever answers: I asked on X for everyone's favourite Sierra Nevada trailhead, and every reply goes on the map, bigger the more people name it."
    data:
      - name: "Replies on X (names of trailheads only)"
        url: https://x.com/bdgroves
      - name: "OpenStreetMap trailheads (Overpass API)"
        url: https://overpass-api.de/
    tools: [X, Python, Mapbox]
    prep: "Asked on X on October 3. Paste each reply's trailhead into answers.csv (no handles); render; add any unplaced names to places.csv."
    status: data

  - day: 17
    theme: Light & dark
    title: "Great Basin's dark sky"
    pitch: "Night lights across Nevada and Utah, with Great Basin National Park's dark sky set against the glow of Las Vegas and Salt Lake City."
    data:
      - name: "NASA Black Marble, via NASA GIBS (no login)"
        url: https://gibs.earthdata.nasa.gov/
      - name: "DarkSky International: Great Basin National Park (Dark Sky Park, 2016)"
        url: https://darksky.org/places/great-basin-national-park-dark-sky-park/
    tools: [Python, matplotlib]
    prep: "Drafted from the Black Marble composite NASA GIBS serves without a login. With the Earthdata secrets added to this repo it could use VNP46A4 annual radiance instead."
    status: draft

  - day: 18
    theme: "NULL"
    title: "Nobody lives here"
    pitch: "Nevada's 2020 census blocks with a population of zero. Most of the state is null."
    data:
      - name: "Census 2020 blocks with P1 population"
        url: https://www.census.gov/geographies/mapping-files/time-series/geo/tiger-line-file.html
    tools: [Python, geopandas]
    prep: "Drafted (2020 TIGER/Line blocks)."
    status: draft

  - day: 19
    theme: Smell
    title: "What the Yakima Valley smells like"
    pitch: "Washington's hop acreage by variety, coloured by aroma (citrus, pine, tropical, earthy) from HopLore."
    data:
      - name: "USDA NASS National Hop Report (acreage by variety and state)"
        url: https://www.nass.usda.gov/
      - name: "WSDA Agricultural Land Use 2024 (Yakima County hop fields)"
        url: https://agr.wa.gov/departments/land-and-water/natural-resources/agricultural-land-use
      - name: "HopLove aroma descriptors and NASS acreage"
        url: https://github.com/bdgroves/hoplove
    tools: [Python]
    prep: "Drafted: WSDA 2024 hop fields in Yakima County; WA 2025 acreage by leading aroma from HopLove."
    status: draft
    deeper:
      - name: "HopLove: know your hops"
        url: https://brooksgroves.com/hoplove/
      - name: "Blog: What's in the Can? Building HopLove"
        url: https://brooksgroves.com/blog/hoplove-post.html

  - day: 20
    theme: Hexagons
    title: "Kangaroo rats in hexagons"
    pitch: "Every Dipodomys observation across the Southwest and Great Basin, binned into H3 hexagons. A return to my 2023 Day 1."
    data:
      - name: "GBIF occurrence download (genus Dipodomys)"
        url: https://www.gbif.org/
    tools: [Python, h3]
    prep: "Drafted from the GBIF search API. For the citable version: add GBIF_USER, GBIF_PWD and GBIF_EMAIL as repo secrets and run the \"GBIF download for Day 20\" Action; it requests the download, waits for the DOI, re-renders from it and cites it."
    status: draft
    deeper:
      - name: "DIPODOMYS: Death Valley's kangaroo rats"
        url: https://brooksgroves.com/dipodomys
      - name: "Blog: DIPODOMYS"
        url: https://brooksgroves.com/blog/dipodomys-post.html

  - day: 21
    theme: OpenStreetMap
    title: "Groveland, by volunteers"
    pitch: "Everything OpenStreetMap knows about Groveland and Big Oak Flat, after I add what's missing."
    data:
      - name: "OpenStreetMap (Overpass API or Geofabrik extract)"
        url: https://download.geofabrik.de/north-america/us/california.html
    tools: [Python, osmnx]
    prep: "Drafted as the before map, straight from Overpass. After an evening of OSM edits, re-render with make.py --refresh."
    status: draft
    deeper:
      - name: "Memoir: the Sierra Foothills stories"
        url: https://memoir.brooksgroves.com/sierra-foothills.html

  - day: 22
    theme: Projections
    title: "The world from Groveland"
    pitch: "An azimuthal equidistant map centred on Groveland, where I grew up, with straight lines (true distances) to everywhere I've been since, from Namibia to Guadeloupe."
    data:
      - name: "Natural Earth"
        url: https://www.naturalearthdata.com/
    tools: [Python, cartopy or pyproj]
    prep: "Places come from the Countries Visited layer on brooksgroves.com/maps.html (37 countries; where there are geocache finds, the middle of them), plus Lakewood, Brenham, Reno and the Ruby Mountains. Add a country there and to places.csv, then re-render."
    status: draft

  - day: 23
    theme: Taste
    title: "Every brewery I've checked into"
    pitch: "My Untappd check-ins, mapped by brewery, sized by how many beers."
    data:
      - name: "Untappd check-in export"
        url: https://untappd.com/
        note: "Export is a Supporter feature."
    tools: [Python]
    prep: "Drafted from the year of beer history HopLove keeps (Untappd); breweries placed with Open Brewery DB."
    status: draft
    deeper:
      - name: "HopLove: every hop in 2,000 Northwest beers"
        url: https://brooksgroves.com/hoplove/

  - day: 24
    theme: Network
    title: "Every stream that reaches Modesto"
    pitch: "The whole Tuolumne river network above Modesto, by stream order, with the SIERRA-FLOW gages on it."
    data:
      - name: "USGS NLDI upstream navigation (NHDPlus flowlines)"
        url: https://labs.waterdata.usgs.gov/about-nldi/
    tools: [Python, geopandas]
    prep: "Drafted (NLDI flowlines; Strahler order computed on the network)."
    status: draft
    deeper:
      - name: "SIERRA-FLOW: Sierra rivers in COBOL"
        url: https://brooksgroves.com/sierra-flow-cobol/
      - name: "Sierra Streamflow dashboard"
        url: https://brooksgroves.com/sierra-streamflow

  - day: 25
    theme: Is this a map?
    title: "The Beast Quake"
    pitch: "January 8, 2011: the Seahawks' playoff win over the Saints on the seismometer across the street from the stadium, ten minutes a line, with Marshawn Lynch's 67-yard touchdown run shaking the ground at 4:42 PM. A map of a game, or of a place?"
    data:
      - name: "EarthScope FDSN dataselect (station UW.KDK, channel ENZ)"
        url: https://service.earthscope.org/
      - name: "PNSN: Marshawn Lynch shakes the PNSN"
        url: https://pnsn.org/blog/n-yo-seismic-network-marshawn-lynch-shakes-the-pnsn
    tools: [Python, ObsPy]
    prep: "Drafted: KDK's accelerometer, 12:50 to 5:10 PM PST. The run is found in the data as the strongest 20 seconds of 1-5 Hz shaking all afternoon (4:42:54 PM, 1.9x the runner-up). The Rainier helicorder is kept in rainier.py."
    deeper:
      - name: "The Beast Quake on Wikipedia"
        url: https://en.wikipedia.org/wiki/Beast_Quake
      - name: "PNSN: the Seahawks experiments, listening to the crowd since 2011"
        url: https://pnsn.org/data-research/experiments/seahawks
      - name: "AFTERSHOCK: live earthquake monitor"
        url: https://brooksgroves.com/aftershock
    status: draft

  - day: 26
    theme: Water
    title: "Lake Tahoe, clear and deep"
    pitch: "Tahoe's floor, 497 m at the deepest, and beside it the lake's clarity on the same downward axis: how far a Secchi disk could be seen each year since 1968, from the record my SECCHI project keeps."
    data:
      - name: "UC Davis TERC Secchi record (EDI, CC BY 4.0), via SECCHI"
        url: https://brooksgroves.com/secchi/
      - name: "USGS DDS-55 Lake Tahoe bathymetry"
        url: https://pubs.usgs.gov/dds/dds-55/
    tools: [Python, rasterio, matplotlib]
    prep: "Drafted: depth from the 1998 USGS multibeam grid, clarity from TERC's index station."
    status: draft
    deeper:
      - name: "secchi: a modern Secchi disk for Lake Tahoe"
        url: https://brooksgroves.com/secchi/
      - name: "Blog: A Plate on a Rope"
        url: https://brooksgroves.com/blog/secchi-post.html

  - day: 27
    theme: New tool
    title: "Every building in Washington"
    pitch: "Every building in Washington from Overture Maps, queried with DuckDB's spatial extension and drawn with lonboard. Both new to me."
    data:
      - name: "Overture Maps buildings"
        url: https://overturemaps.org/
    tools: [DuckDB spatial, lonboard]
    prep: "Drafted: DuckDB query straight against Overture on S3, gridded. Still to do: the lonboard interactive."
