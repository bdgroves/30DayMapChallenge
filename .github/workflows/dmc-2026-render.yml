name: Render a 2026 map

on:
  workflow_dispatch:
    inputs:
      day:
        description: Day number(s), e.g. 28 or "8 15 18"
        required: true

permissions:
  contents: write

concurrency:
  group: dmc-2026
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 2026
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          manifest-path: 2026/pixi.toml
          locked: false
          cache: ${{ hashFiles('2026/pixi.lock') != '' }}
      - name: Restore downloaded data (DEM tiles, GBIF pages, census blocks...)
        uses: actions/cache/restore@v4
        with:
          path: |
            2026/day-*/data
            2026/.cache
          key: dmc-2026-data-${{ github.run_id }}
          restore-keys: dmc-2026-data-
      - name: Render day(s) ${{ inputs.day }}
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}     # Mapbox basemaps; maps still render without it
          MAPBOX_STYLE: ${{ vars.MAPBOX_STYLE }}        # e.g. bdgroves/<style id> once the house style is uploaded
        run: |
          rc=0
          pixi run render ${{ inputs.day }} > render.log 2>&1 || rc=$?
          cat render.log
          # key lines ("= " from make.py) as annotations so each day's outcome is readable from the run page
          grep -E '^(> |! day|= )' render.log | head -45 | sed 's/^/::notice::/' || true
          if [ $rc -ne 0 ]; then
            echo "::error title=render ${{ inputs.day }}::$(tail -40 render.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
          echo "RC=$rc" > rc.txt
      - name: Commit the maps that rendered (and the pixi lock, so Windows gets the same versions)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add day-*/out days.json README.md day-*/README.md pixi.lock
          git diff --staged --quiet && exit 0
          git commit -q -m "2026: render day ${{ inputs.day }} [skip ci]"
          # the build job may have just rebuilt days.json/README; our regenerated copies win
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
      - name: Save downloaded data for next time (even if a day failed)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            2026/day-*/data
            2026/.cache
          key: dmc-2026-data-${{ github.run_id }}
      - name: Fail the run if a day failed
        run: grep -q 'RC=0' rc.txt
