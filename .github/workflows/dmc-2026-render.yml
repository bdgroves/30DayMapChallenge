name: Render a 2026 map

on:
  workflow_dispatch:
    inputs:
      day:
        description: Day number (1-30)
        required: true

permissions:
  contents: write

concurrency:
  group: dmc-2026
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 2026
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          manifest-path: 2026/pixi.toml
          locked: false
          cache: ${{ hashFiles('2026/pixi.lock') != '' }}
      - name: Render day ${{ inputs.day }}
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}     # Mapbox basemaps; maps still render without it
          MAPBOX_STYLE: ${{ vars.MAPBOX_STYLE }}        # e.g. bdgroves/<style id> once the house style is uploaded
        run: |
          pixi run render ${{ inputs.day }} > render.log 2>&1 || {
            cat render.log
            echo "::error title=render day ${{ inputs.day }}::$(tail -25 render.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1; }
          cat render.log
      - name: Commit the map (and the pixi lock, so Windows gets the same versions)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add day-*/out days.json README.md day-*/README.md pixi.lock
          git diff --staged --quiet && exit 0
          git commit -q -m "2026: render day ${{ inputs.day }} [skip ci]"
          git pull -q --rebase && git push -q
