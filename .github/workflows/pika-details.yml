name: Pika details

# Washington pika records with their label details, from the citable GBIF download.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['gbif/pika/details.py', '.github/workflows/pika-details.yml']

permissions:
  contents: write

jobs:
  details:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas
      - run: python gbif/pika/details.py 2>&1 | tee gbif/pika/out/details.log
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gbif/pika/out
          git diff --staged --quiet && exit 0
          git commit -q -m "Pika: Washington records with label details [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
