name: probe dalquest
on:
  push:
    branches: [probe/dalquest]
    paths: [.github/workflows/probe-dalquest.yml, probe/inat.py]
permissions: {contents: write}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c "import json,urllib.request;print(json.load(urllib.request.urlopen('https://api.inaturalist.org/v1/taxa?q=Ochotona%20princeps&rank=species'))['results'][0]['id'])"
          python3 probe/inat.py
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe && git commit -m "probe: iNaturalist pika near the WA sites [skip ci]" && git push
